version: "3.7"

networks:
  transfer-app-network:
    name: transfer-app-network
    driver: bridge

volumes:
  transfer-app-timescaledb__data:
    driver: local
  transfer-app-minio-latest__data:
    driver: local

services:
  # Main application container
  application:
    container_name: transfer-app-application
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker-host.sock
    networks:
      - transfer-app-network
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - DOWNLOAD_SERVICE_URL=${DOWNLOAD_SERVICE_URL}
      - NODE_OPTIONS=--max-old-space-size=4096
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    depends_on:
      - transfer-app-timescaledb
      - transfer-app-minio

  # Minio
  transfer-app-minio:
    container_name: transfer-app-minio
    image: minio/minio:latest
    networks:
      - transfer-app-network
    volumes:
      - type: volume
        source: transfer-app-minio-latest__data
        target: /data
        volume:
          nocopy: false
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"

  # TimescaleDB
  transfer-app-timescaledb:
    container_name: transfer-app-timescaledb
    image: timescale/timescaledb:latest-pg17
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cwx_dev}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cwx_password}
      - POSTGRES_DB=${POSTGRES_DB:-transfer_app}
    ports:
      - "5439:5432"
    restart: unless-stopped
    networks:
      - transfer-app-network
    volumes:
      - type: volume
        source: transfer-app-timescaledb__data
        target: /var/lib/postgresql/data
        volume:
          nocopy: false
